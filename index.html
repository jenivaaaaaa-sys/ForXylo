          <span class="date-img"><svg viewBox="0 0 300 190" aria-hidden="true">
            <rect width="300" height="190" fill="#2b3f8f"/>
            <g fill="#fff"><circle cx="32" cy="30" r="2.5"/><circle cx="262" cy="36" r="3"/><circle cx="44" cy="76" r="2"/><circle cx="276" cy="84" r="2"/><circle cx="238" cy="20" r="2"/></g>
            <rect x="60" y="22" width="150" height="98" rx="10" fill="#111"/>
            <rect x="68" y="30" width="134" height="82" rx="4" fill="#4f8cf0"/>
            <path d="M121 52l32 19-32 19z" fill="#fff"/>
            <rect x="108" y="120" width="54" height="9" rx="2" fill="#111"/>
            <path d="M-4 148Q40 126 90 146T196 148V194H-4Z" fill="#ffb3d1" stroke="#111" stroke-width="4"/>
            <path d="M40 168C28 160 32 150 40 155C48 150 52 160 40 168Z" fill="#fff" stroke="#111" stroke-width="3"/>
            <g stroke="#111" stroke-width="3"><circle cx="222" cy="94" r="9" fill="#fff6d6"/><circle cx="236" cy="86" r="10" fill="#fff6d6"/><circle cx="250" cy="93" r="9" fill="#fff6d6"/><circle cx="231" cy="78" r="8" fill="#fff6d6"/><circle cx="245" cy="77" r="8" fill="#fff6d6"/></g>
            <path d="M214 98h44l-6 58h-32z" fill="#fff" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
            <path d="M224 98l3 58M236 98v58M248 98l-3 58" stroke="#4f8cf0" stroke-width="5"/>
          </svg></span>
          <span class="date-text">
            <span class="date-name">Netflix &amp; Chill</span>
            <span class="date-desc">Cozy blankets, our favorite films.</span>
          </span>
        </button>
      </div>

      <button class="continue" id="confirmBtn" disabled>Continue <span aria-hidden="true">&#9829;</span></button>
    </div>
  </section>

  <!-- 7. Date confirmed -->
  <section class="page confirm-page" id="confirmPage" hidden>
    <button class="sound-btn" id="soundBtn" aria-label="Sound on" title="Sound on/off">&#128266;</button>
    <div class="confirm-inner">
      <div class="confirm-heart" aria-hidden="true">
        <span class="heart-core">&#9829;</span>
        <span class="spark s1">&#10022;</span><span class="spark s2">&#10022;</span>
        <span class="spark s3">&#10022;</span><span class="spark s4">&#10022;</span>
      </div>
      <p class="confirm-kicker">It's official</p>
      <h2 class="confirm-title">Date Confirmed</h2>

      <div class="ticket">
        <div class="ticket-img" id="ticketImg"></div>
        <div class="ticket-body">
          <span class="ticket-label">Our date</span>
          <span class="ticket-name" id="chosen"></span>
        </div>
      </div>

      <p class="confirm-note">I can't wait, baby <span aria-hidden="true">&#128153;</span></p>

      <button class="save-btn" id="saveBtn">Save this date <span aria-hidden="true">&#128248;</span></button>
      <p class="save-status" id="saveStatus" role="status"></p>
    </div>
  </section>
