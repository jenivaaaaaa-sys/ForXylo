<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b1a3a">
  <title>A letter bloomed for you</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Caveat:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Reusable sunflower drawing -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <g id="sunflower">
        <g fill="#f6b91c">
          <ellipse cx="50" cy="14" rx="9" ry="20"/>
          <ellipse cx="50" cy="14" rx="9" ry="20" transform="rotate(30 50 50)"/>
          <ellipse cx="50" cy="14" rx="9" ry="20" transform="rotate(60 50 50)"/>
          <ellipse cx="50" cy="14" rx="9" ry="20" transform="rotate(90 50 50)"/>
          <ellipse cx="50" cy="14" rx="9" ry="20" transform="rotate(120 50 50)"/>
          <ellipse cx="50" cy="14" rx="9" ry="20" transform="rotate(150 50 50)"/>
          <ellipse cx="50" cy="14" rx="9" ry="20" transform="rotate(180 50 50)"/>
          <ellipse cx="50" cy="14" rx="9" ry="20" transform="rotate(210 50 50)"/>
          <ellipse cx="50" cy="14" rx="9" ry="20" transform="rotate(240 50 50)"/>
          <ellipse cx="50" cy="14" rx="9" ry="20" transform="rotate(270 50 50)"/>
          <ellipse cx="50" cy="14" rx="9" ry="20" transform="rotate(300 50 50)"/>
          <ellipse cx="50" cy="14" rx="9" ry="20" transform="rotate(330 50 50)"/>
        </g>
        <circle cx="50" cy="50" r="17" fill="#5a3418"/>
        <circle cx="50" cy="50" r="10" fill="#7a4a24"/>
      </g>
    </defs>
  </svg>

  <div class="stars" aria-hidden="true"></div>

  <!-- Field of sunflowers -->
  <div class="field" aria-hidden="true">
    <div class="stem s1"><svg viewBox="0 0 100 100"><use href="#sunflower"/></svg></div>
    <div class="stem s2"><svg viewBox="0 0 100 100"><use href="#sunflower"/></svg></div>
    <div class="stem s3"><svg viewBox="0 0 100 100"><use href="#sunflower"/></svg></div>
    <div class="stem s4"><svg viewBox="0 0 100 100"><use href="#sunflower"/></svg></div>
    <div class="stem s5"><svg viewBox="0 0 100 100"><use href="#sunflower"/></svg></div>
  </div>

  <!-- Step 1: enter the name -->
  <main class="cover" id="nameScreen">
    <p class="small">Before we begin</p>
    <h1 class="ask">Enter your name</h1>
    <form class="name-form" id="nameForm" autocomplete="off">
      <label class="sr" for="nameInput">Your name</label>
      <input id="nameInput" type="text" maxlength="30" placeholder="Type your name" required>
      <p class="error" id="nameError" role="alert"></p>
      <button class="open-btn" type="submit">Continue</button>
    </form>
  </main>

  <!-- Step 2: cover -->
  <main class="cover hide" id="cover" aria-hidden="true">
    <p class="small">A letter for</p>
    <h1 id="recipient">Someone special</h1>

    <button class="seal" id="seal" aria-label="Open the letter">
      <svg viewBox="0 0 100 100"><use href="#sunflower"/></svg>
    </button>

    <p class="from" id="sender">with love</p>
    <button class="open-btn" id="openBtn">Open the letter</button>
  </main>

  <!-- Letter -->
  <section class="letter-wrap" id="letterWrap" aria-hidden="true">
    <article class="letter" id="letter">
      <p class="to" id="letterTo"></p>
      <div class="body" id="letterBody"></div>
      <p class="sign" id="letterSign"></p>
      <button class="close-btn" id="closeBtn">Fold it back</button>
    </article>
  </section>

  <script src="script.js"></script>
</body>
</html>
