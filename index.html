<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f86e8">
  <title>You've got mail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background -->
  <div class="sky" aria-hidden="true">
    <svg class="cloud c1" viewBox="0 0 140 80"><path d="M30 60c-16 0-24-18-8-26 2-16 26-22 38-10 10-12 34-6 36 12 18 0 22 24 4 24z"/></svg>
    <svg class="cloud c2" viewBox="0 0 140 80"><path d="M30 60c-16 0-24-18-8-26 2-16 26-22 38-10 10-12 34-6 36 12 18 0 22 24 4 24z"/></svg>
    <svg class="cloud c3" viewBox="0 0 140 80"><path d="M30 60c-16 0-24-18-8-26 2-16 26-22 38-10 10-12 34-6 36 12 18 0 22 24 4 24z"/></svg>
  </div>
  <div class="hill" aria-hidden="true"></div>

  <!-- Stage: envelope + card -->
  <main class="stage" id="stage">
    <div class="env" id="env">

      <!-- back of envelope -->
      <svg class="env-part env-back" viewBox="0 0 320 212" aria-hidden="true">
        <rect x="3" y="3" width="314" height="206" rx="6" fill="#2f6fd1" stroke="#111" stroke-width="6"/>
      </svg>

      <!-- the card -->
      <section class="card" id="card" aria-live="polite">
        <p class="card-emoji" aria-hidden="true">🍢</p>
        <h1>kwek kwek tayo</h1>
        <div class="choices" id="choices">
          <button class="btn yes" id="yesBtn">Yes</button>
          <button class="btn no" id="noBtn">No</button>
        </div>
      </section>

      <!-- front pocket -->
      <svg class="env-part env-front" viewBox="0 0 320 212" aria-hidden="true">
        <path d="M3 3 L160 118 L317 3 V206 Q317 209 314 209 H6 Q3 209 3 206 Z" fill="#5aa9f0" stroke="#111" stroke-width="6" stroke-linejoin="round"/>
      </svg>

      <!-- flap -->
      <svg class="env-part env-flap" viewBox="0 0 320 212" aria-hidden="true">
        <path d="M3 3 H317 L160 122 Z" fill="#8fd0ff" stroke="#111" stroke-width="6" stroke-linejoin="round"/>
      </svg>

      <!-- click target -->
      <button class="env-open" id="envOpen" aria-label="Open the envelope">
        <span class="env-seal" aria-hidden="true">
          <svg viewBox="0 0 100 100"><g fill="#fff" stroke="#111" stroke-width="4">
            <ellipse cx="50" cy="66" rx="22" ry="18"/>
            <ellipse cx="22" cy="42" rx="9" ry="12" transform="rotate(-20 22 42)"/>
            <ellipse cx="40" cy="26" rx="9" ry="12" transform="rotate(-6 40 26)"/>
            <ellipse cx="60" cy="26" rx="9" ry="12" transform="rotate(6 60 26)"/>
            <ellipse cx="78" cy="42" rx="9" ry="12" transform="rotate(20 78 42)"/>
          </g></svg>
        </span>
      </button>
    </div>
    <p class="hint" id="hint">Tap the envelope to open it</p>
  </main>

  <!-- HELL YEAHHH -->
  <section class="cheer" id="cheer" aria-hidden="true">
    <div class="burst"></div>
    <h2>HELL YEAHHH</h2>
  </section>

  <!-- Letter -->
  <section class="letter-wrap" id="letterWrap" aria-hidden="true">
    <article class="letter">
      <p class="to" id="letterTo"></p>
      <div class="body" id="letterBody"></div>
      <p class="sign" id="letterSign"></p>
      <button class="btn again" id="againBtn">Start over</button>
    </article>
  </section>

  <script src="script.js"></script>
</body>
</html>
